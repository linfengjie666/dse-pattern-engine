    { id: "C8", pattern: "C", difficulty: 4, source: "QB Ch01", question: "Mrs. Tam owns a premise that is worth $1 million. She can use it to open her own boutique or rent it out for $6,000 a month. She can also sell it and deposit the money in a bank. The saving rate is 6% per annum. Mrs. Tam\u2019s opportunity cost of using the premise to open her own boutique is", options: ["$5,000 a month.", "$60,000 a year.", "$6,000 a month.", "$660,000 a year."], answer: 2, main_error: "E5", subtype: "C1", explanation: "Mrs. Tam\u2019s opportunity cost of using the premise to open her own boutique is the highest-valued option forgone, i.e. the rent that she receives from renting out the premise, which is $6,000 a month.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B22", pattern: "A", difficulty: 2, source: "QB Ch01", question: "Angel has 100 stamps and can redeem them for ONE of the following items (all require 100 stamps):\n\nOrder of preference:\n1st: A bottle of cooking oil\n2nd: A box of cookies\n3rd: A box of chocolate\n4th: A pack of orange juice\n\nAngel chooses a box of cookies. What is her opportunity cost?", options: ["a pack of orange juice", "a box of chocolate", "a pack of orange juice and a box of chocolate", "a bottle of cooking oil"], answer: 3, main_error: "E1", explanation: "OC = highest-valued option forgone = 1st preference = a bottle of cooking oil. The box of chocolate (3rd) and orange juice (4th) are irrelevant \u2014 OC is always the single next-best, which here is cooking oil (1st, since she chose 2nd).", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "C9", pattern: "C", difficulty: 4, source: "QB Ch01", question: "Samuel is planning what to do during the summer holiday. He can work as a waiter earning $8,000 or as a salesperson earning $8,500. If he does not take up any summer job, he will take a computer course which costs him $2,000. Samuel\u2019s cost of taking the computer course is _____________.", options: ["$2,000", "$8,500", "$10,000", "$10,500"], answer: 3, main_error: "E5", subtype: "C2", explanation: "Samuel\u2019s opportunity cost of taking the computer course = Course fee paid (explicit cost) + the highest-valued alternative use of the summer holiday (implicit cost) = $2,000 + $8,500 = $10,500.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B23", pattern: "B", difficulty: 2, source: "QB Ch01", question: "Which of the following is/are the opportunity cost(s) of showing \u201CA Symphony of Lights\u201D (\u5E7B\u5F69\u8A60\u9999\u6C5F)? 1.  The money spent on buying equipment needed in the show. 2.  The time spent on preparing the show. 3.  The time spent on watching the show.", options: ["(2) only", "(1) and (2) only", "(1) and (3) only", "(1), (2) and (3)"], answer: 1, main_error: "E2", explanation: "Both the money spent on buying the equipment and the time spent on preparing the show have alternative uses. They are therefore the opportunity costs of showing \u201CA Symphony of Lights\u201D.  (3) is incorrect. It is the cost of watching the show, not the cost of showing show.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B24", pattern: "B", difficulty: 2, source: "QB Ch01", question: "Christy likes to make dessert for her friends. Which of the following is/are the opportunity cost(s) of making dessert for her friends? 1.  time spent on making the dessert 2.  money spent on buying the ingredients 3.  time spent on eating the dessert", options: ["(1) only", "(1) and (2) only", "(2) and (3) only", "(1), (2) and (3)"], answer: 1, main_error: "E2", explanation: "For (1) and (2), the time and money spent have alternative uses, so they are the opportunity costs of making dessert for her friends.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B25", pattern: "B", difficulty: 2, source: "QB Ch01", question: "Which of the following statements about opportunity cost is CORRECT?", options: ["When the value of an option increases, the opportunity cost of choosing that option increases.", "Opportunity cost does not exist in a barter economy.", "If there is no choice, there is no opportunity cost.", "When the value of options other than the highest-valued option forgone changes, the opportunity cost of choosing an option increases."], answer: 2, main_error: "E2", explanation: "Opportunity cost of a choice is the highest-valued option forgone. If there is no choice, nothing has to be forgone when choosing an option. Therefore, there is no opportunity cost.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "D9", pattern: "D", difficulty: 2, source: "QB Ch01", question: "Mr. Chow is choosing between a tour of Taiwan and a tour of Yunnan. The opportunity cost of choosing the Yunnan tour will increase if", options: ["there is an earthquake in Yunnan.", "the value of Renminbi increases, in terms of Hong Kong dollar.", "the quality of the hotel that Mr. Chow stays during the Taiwan tour is poor.", "the goods in Taiwan are cheaper because of deflation."], answer: 3, main_error: "E6", explanation: "The opportunity cost of choosing the Yunnan tour is the Taiwan tour. As the goods in Taiwan become cheaper, the value of visiting Taiwan increases. Hence, the opportunity cost of visiting Yunnan increases.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "C10", pattern: "C", difficulty: 4, source: "QB Ch01", question: "Jason has $200,000 savings. Below are Jason\u2019s options of spending the money and his order of preference. First preference: Paying the down payment on a home mortgage. Second preference: Buying a car. Third preference: Lending the money to his friend and receiving interest in return. Which of the fol", options: ["The performance of the car is not as good as expected.", "Jason\u2019s friend is not able to pay interest to him.", "The price of the property that he has bought decreases.", "The house is not as comfortable as expected."], answer: 0, main_error: "E5", subtype: "C1", explanation: "The opportunity cost of using the money to pay the down payment on a home mortgage is buying a car. The poor performance of the car lowers the value of buying the car, so the opportunity cost decreases.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "D10", pattern: "D", difficulty: 2, source: "QB Ch01", question: "Mary is choosing between a trip to Japan and a trip to Korea. She finally decides to go to Japan. Which of the following will affect Mary\u2019s opportunity cost of going to Japan?", options: ["Air passenger departure tax increases.", "She has to cancel her trip to Japan or Korea because of sickness.", "The theme park in Korea that Mary plans to visit is closed for maintenance.", "An earthquake happens in Japan."], answer: 2, main_error: "E6", explanation: "The opportunity cost of going to Japan is the tour to Korea. The closure of the theme park in Korea lowers the value of the tour to Korea, so the opportunity cost of going to Japan decreases.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "D11", pattern: "D", difficulty: 2, source: "QB Ch01", question: "Miss Chan has bought a flat. Which of the following will affect the opportunity cost for her to live in the flat?", options: ["Her neighbours always play mahjong loudly and this makes her unable to sleep well at night.", "Another building is built in front of her building and blocks the view of her flat.", "The property market is booming.", "The property management of the housing estate she lives in is poor."], answer: 2, main_error: "E6", explanation: "If Miss Chan does not live in the flat, she can rent or sell it for money. This amount is her opportunity cost of living in the flat. When the property market is booming, she can rent or sell her flat at a higher price. Her opportunity cost of living in the flat therefore increases.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "C11", pattern: "D", difficulty: 4, source: "QB Ch01", question: "Joe received $3,000 from his father as a birthday present. He is now considering the following two options of using the money: going to Thailand with his friends or saving it in a bank. His opportunity cost of going to Thailand with his friends will change if", options: ["the trip is not as good as Joe has expected.", "an infectious disease breaks out in Thailand.", "the interest rate on savings increases.", "there is typhoon in Thailand."], answer: 2, main_error: "E5", subtype: "C1", explanation: "Joe\u2019s opportunity cost of going to Thailand is the interest that he can receive from depositing the money in a bank. The increase in interest rate on savings means that Joe has to forgo more interest, so Joe\u2019s opportunity cost of going to Thailand increases.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "A6", pattern: "C", difficulty: 2, source: "QB Ch01", question: "Amy is a student. She can do the following things at the weekend:\n1st choice: shopping\n2nd choice: watching a movie\n3rd choice: doing revision at home\n\nIf the movie is very boring, Amy's cost of doing revision at home will ______.", options: ["increase", "decrease", "remain unchanged", "increase, decrease or remain unchanged"], answer: 2, main_error: "E1", subtype: "C1", explanation: "OC of doing revision at home = value of highest-valued option forgone = shopping (1st choice). Whether the movie is boring or not does not affect the value of shopping. So the cost of doing revision remains unchanged.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "D12", pattern: "C", difficulty: 2, source: "QB Ch01", question: "Amy has a day off and she is choosing between going to a sculpture exhibition and working as a tutor to earn money. Which of the following will change her cost of going to the exhibition?\n(1) The sculpture exhibition is too crowded.\n(2) The hourly wage of tutors increases.\n(3) Amy's student is very naughty.", options: ["(1) only", "(1) and (2) only", "(1) and (3) only", "(2) and (3) only"], answer: 3, main_error: "E6", subtype: "C1", explanation: "The income from working as a tutor is the opportunity cost of going to the sculpture exhibition. For (2), the increase in the hourly wage of tutors raises the value of being a tutor. The cost of going to the exhibition therefore increases. For (3), the fact that the student is very naughty lowers the value of being a tutor. The cost of going to the exhibition therefore decreases. (1) is incorrect \u2014 the crowdedness of the exhibition affects its enjoyment (value of the chosen option), not the cost.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "D13", pattern: "D", difficulty: 2, source: "QB Ch01", question: "Ivy is having an examination tomorrow and she is choosing between studying at home and hiking with friends. Her opportunity cost of studying at home will change if", options: ["it rains when she is hiking with friends.", "she gets a poor result in the examination.", "she falls asleep when she is studying at home.", "she cannot finish revising the whole syllabus."], answer: 0, main_error: "E6", explanation: "Ivy\u2019s opportunity cost of studying at home is hiking with friends. If it rains when she is hiking, the value of hiking decreases and the opportunity cost of studying at home therefore decreases.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "D14", pattern: "D", difficulty: 2, source: "QB Ch01", question: "John wants to take a course in his spare time. He is choosing between a computer course and a cooking course. Which of the following will cause his opportunity cost of choosing the cooking course to decrease?", options: ["The course fee of the cooking course increases.", "The prospect of being a cook becomes worse.", "The price of teaching materials for the cooking course increases.", "Fewer computer application programmes are taught in the computer course."], answer: 3, main_error: "E6", explanation: "The cost of choosing to take the cooking course is taking the computer course. The fact that fewer computer application programmes are taught in the computer course lowers the value of taking the course. Thus, the cost of taking the cooking course decreases.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B26", pattern: "B", difficulty: 2, source: "QB Ch01", question: "Free shuttle bus service running between shopping malls and housing estates is", options: ["a free good because it is free of charge.", "a free good because no one is willing to pay for it.", "an economic good because it helps increase the number of people going to the shopping malls.", "an economic good because various resources are used in the provision of the free shuttle bus service."], answer: 3, main_error: "E2", explanation: "Those resources used in providing the free shuttle bus service have alternative uses and this means the provision of the service involves an opportunity cost. Therefore, the free shuttle bus service is an economic good.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B27", pattern: "B", difficulty: 2, source: "QB Ch01", question: "Many property agencies hire people to give out leaflets on prices of apartments for sale on the streets. These leaflets are", options: ["free goods as no one wants to read them.", "free goods as they are free of charge.", "economic goods because they help boost the business of the property agencies.", "economic goods because scarce resources are used to produce them."], answer: 3, main_error: "E2", explanation: "The leaflets are produced using scarce resources with alternative uses and this means an opportunity cost is involved in producing them. Thus, they are economic goods.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B28", pattern: "B", difficulty: 2, source: "QB Ch01", question: "Sometimes there are free gifts inside magazines. Which of the following statements about these free gifts is CORRECT?", options: ["The free gifts are free goods because nothing has to be forgone to get them.", "The free gifts are economic goods because people have to pay for the magazines in order to get them.", "The free gifts are free goods because everyone who buys the magazines gets them.", "The free gifts are economic goods because resources used to produce these free gifts have alternative uses."], answer: 3, main_error: "E2", explanation: "As costs are involved in providing the free gifts, they are economic goods.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B29", pattern: "B", difficulty: 2, source: "QB Ch01", question: "In some schools, students use the printing service without paying any fee. To society, the printing service is a/an _________ because _____________.", options: ["free good \u2026 the school does not aim to maximise profit", "free good \u2026 the printing service is free of charge", "economic good \u2026 when one student is using the printing service, other students have to wait", "economic good \u2026 paper and ink are needed for the provision of printing services"], answer: 3, main_error: "E2", explanation: "As scarce resources such as paper and ink are used in the provision of printing service, an opportunity cost is involved. Thus, it is an economic good.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B30", pattern: "B", difficulty: 2, source: "QB Ch01", question: "Some community service centres provide free tutorial classes to students in need. The free tutorial service is", options: ["a free good because the students need not pay any tuition fee.", "a free good because it does not have market value.", "an economic good because the tuition fee has already been included in the membership fee.", "an economic good because the tutors have positive time cost."], answer: 3, main_error: "E2", explanation: "Since scarce resources are used in providing the free tutorial service, opportunity costs are involved (e.g. the highest-valued alternative use of time of the tutors). Thus, it is an economic good.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B31", pattern: "B", difficulty: 2, source: "QB Ch01", question: "Suppose there are only two people in the economy. Maggie can produce 4 units of clothes or 8 units of hats in an hour and Andrew can produce 10 units of clothes or 4 units of hats in an hour. From the above information, Maggie should specialise in producing ______________ and Andrew should specialis", options: ["clothes \u2026 clothes", "hats \u2026 clothes", "clothes \u2026 hats", "hats \u2026 hats"], answer: 1, main_error: "E2", explanation: "Maggie has an opportunity cost (1 unit of hats = 0.5 unit of clothes) lower than Andrew (1 unit of hats = 2.5 units of clothes), so she should specialise in producing hats.  Andrew has an opportunity cost (1 unit of clothes = 0.4 unit of hats) lower than Maggie (1 unit of clothes = 2 units of hat...", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B32", pattern: "C", difficulty: 2, source: "QB Ch01", question: "(2012) Simon can spend his Saturday afternoon on one of the following activities: studying in the library, going to the beach or joining his auntie's birthday party. Suppose studying in the library is Simon's least preferred activity while joining his auntie's birthday party is his most preferred. Under which of the following situations would Simon's opportunity cost of joining his auntie's birthday party change?", options: ["Everyone who participates in the birthday party can receive a gift coupon of $50.", "Typhoon Signal No. 8 is hoisted, making it impossible for Simon to go to the beach.", "The library is too noisy for Simon to focus on studying.", "The library closes earlier in Saturday afternoon."], answer: 1, main_error: "E2", explanation: "Simon\u2019s opportunity cost of joining his auntie\u2019s birthday party is the highest-valued option forgone, i.e. going to the beach. As the option of going to the beach is no longer available when Typhoon Signal No. 8 is hoisted, the opportunity cost of joining his auntie\u2019s birthday party will become s...", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "A7", pattern: "A", difficulty: 2, source: "QB Ch01", question: "(2014) On a remote island, there is only one man. Which of the following is CORRECT?", options: ["The man does not have to face the problem of scarcity.", "The man does not have to make choices.", "There is no opportunity cost in getting any goods.", "There is no competition for goods and services."], answer: 3, main_error: "E1", explanation: "As there is only one man in the island, he does not have to compete with others for goods and services.  Options A, B and C are incorrect. Even if there is only one man in the island, the resources available may still be not enough to satisfy all the man\u2019s wants. Thus, the man may face the proble...", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B33", pattern: "C", difficulty: 2, source: "QB Ch01", question: "(2014) Doris receives two free movie tickets which are transferable. Which of the following statements about Doris using the two free movie tickets herself is TRUE?", options: ["This does not involve opportunity cost because she does not have to use her own money to buy the movie tickets.", "This does not involve opportunity cost because she does not have to queue up for purchasing the movie tickets.", "This involves opportunity cost because she has to give up the money from reselling the movie tickets.", "This involves opportunity cost because she does not want to watch the movie."], answer: 2, main_error: "E2", explanation: "Since the tickets are transferable, Doris could resell them. By using the tickets herself, she forgoes the resale value \u2014 that is her opportunity cost. Option A is wrong: paying money is irrelevant since she received them for free; the OC comes from the forgone alternative. Option B is wrong: queuing is irrelevant for the same reason. Option D is wrong: personal preference does not eliminate opportunity cost.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "C12", pattern: "C", difficulty: 4, source: "QB Ch01", question: "(2014) Mrs. Chan bought a watch at $15,000 a year ago. Now, its value has depreciated and she can only sell it at $10,000 in the second-hand market, although the market price of a new one is now $12,000. If Mrs. Chan chooses to keep the watch, her opportunity cost will be", options: ["$0", "$10,000", "$12,000", "$15,000"], answer: 1, main_error: "E5", subtype: "C1", explanation: "Mrs. Chan\u2019s opportunity cost of keeping the watch is the money that she can receive from selling the watch in the second-hand market.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "C13", pattern: "C", difficulty: 3, source: "QB Ch01", question: "(2014) Simon got a tablet computer as a birthday gift which worth $3,000. It can be sold for $2,500 in the second-hand market. His opportunity cost of using that tablet computer will be", options: ["equal to zero.", "equal to $3,000.", "higher than zero.", "higher than or equal to zero."], answer: 2, main_error: "E5", subtype: "C1", explanation: "When Simon uses the tablet computer himself, he has to forgo the alternative ways of using the tablet computer, such as selling it in the second-hand market and earning some money. Thus, the opportunity cost will be higher than zero.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "C14", pattern: "C", difficulty: 4, source: "QB Ch01", question: "(2014) Joey owns a unit in a building and she is considering using the unit as an office, a showroom or a restaurant. Suppose the money value of the expected return generated from each usage is $20,000, $30,000 and $35,000 respectively. The opportunity cost of using the unit as a showroom is _______", options: ["$20,000 \u2026 $30,000", "$30,000 \u2026 $30,000", "$35,000 \u2026 $20,000", "$35,000 \u2026 $30,000"], answer: 3, main_error: "E5", subtype: "C1", explanation: "When using the unit as a showroom, the highest-valued option forgone is using the unit as a restaurant, i.e. $35,000. When using the unit as a restaurant, the highest-valued option forgone is using the unit as a showroom, i.e. $30,000.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "B34", pattern: "C", difficulty: 2, source: "QB Ch01", question: "(2014) Which of the following is the LEAST likely cost involved in watching a play?", options: ["the time spent watching the play", "the income given up from working a part-time job because of watching the play", "the disappointment felt since the play is very boring", "the money spent on buying the play ticket"], answer: 2, main_error: "E2", subtype: "C1", explanation: "Option C refers to the situation in which the value of watching a play falls. It is not related to the highest-valued option forgone.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "D16", pattern: "D", difficulty: 2, source: "QB Ch01", question: "(2014) Gloria is either taking a Korean course or taking up a part-time job on Saturday afternoons. Her opportunity cost of taking the Korean course will increase if", options: ["her classmates are very noisy and she cannot concentrate during the lesson.", "she is 15 minutes late because of traffic congestion.", "the hourly wage of the part-time job increases.", "the meal allowance of the part-time job is reduced."], answer: 2, main_error: "E6", explanation: "If she takes the Korean course, she cannot take up the part-time job. When the hourly wage of the part-time job increases, the amount of wages she has to forgo increases. Thus, her opportunity cost of taking the Korean course will increase.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "D17", pattern: "D", difficulty: 2, source: "QB Ch01", question: "(2014) Which of the following will affect the opportunity cost of building a new airport? 1.  Inflation causes an increase in the construction cost by 20%. 2.  The actual usage of the airport is far less than the expected. 3.  Building a new airport causes serious damage to the marine ecosystem.", options: ["(1) and (2) only", "(1) and (3) only", "(2) and (3) only", "(1), (2) and (3)"], answer: 1, main_error: "E6", explanation: "For (1), when the construction cost increases, the monetary cost of building the new airport will increase. For (3), when there is serious damage on the marine ecosystem, the non-monetary cost of building the new airport will increase. (2) is incorrect \u2014 the actual usage of the airport after completion does not affect the opportunity cost of the decision to build it.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "C15", pattern: "C", difficulty: 4, source: "QB Ch01", question: "(2014) Next Wednesday is a public holiday. Ella is choosing between two ways to spend it:\n(1) Visiting a theme park, for which she has already got a free admission ticket\n(2) Working as a part-time model and earn $400\n\nUnder which of the following situations will Ella's opportunity cost of working as a part-time model most likely change?", options: ["She is sick on that day and feels sleepy all day.", "Her brother offers her $400 to buy the ticket from her.", "She enjoys being a model since she can meet a lot of new friends.", "The shops selling souvenirs in the theme park offer discount on public holidays."], answer: 1, main_error: "E5", subtype: "C1", explanation: "Since Ella\u2019s brother offers to buy the ticket, if Ella chooses to work as a part-time model, she can sell the ticket to her brother and earn $400. In this case, the value of the highest-valued option forgone (i.e. visiting a theme park) increases.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "C16", pattern: "C", difficulty: 4, source: "QB Ch01", question: "(2019) Read the following news extracts.\n\nThe HKSAR Government announced the Caring and Sharing Scheme to share the fruits of our economic success with the community \u2026 A person who meets the relevant eligibility criteria may apply to receive $4,000 under the scheme \u2026\n(Source: Working Family Allowance Office, HKSAR Government)\n\nMrs. Wong is eligible to receive $4,000 under the scheme. Which of the following statements is CORRECT?", options: ["To Mrs. Wong, the $4,000 is a free good.", "To Mrs. Wong, receiving the $4,000 involves no cost.", "To Mrs. Wong, using the $4,000 involves cost.", "The $4,000 is an economic good because it satisfies Mrs. Wong wants."], answer: 2, main_error: "E5", subtype: "C1", explanation: "Opportunity cost of a choice is the highest-valued option forgone. Mrs. Wong can choose how to spend the $4,000, which means using the $4,000 involves cost.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "D18", pattern: "D", difficulty: 2, source: "QB Ch01", question: "(2019) Timothy is considering studying Economics or Geography as an elective subject in Secondary 4. Which of the following situations would raise his opportunity cost of studying Economics?", options: ["Timothy thinks that Economics is much more difficult than he expected.", "Timothy finds that Geography students can go for field trips which are interesting to him.", "Timothy has a very good result in his Economics examination.", "The best friend of Timothy, Samuel, chooses to study Economics as well."], answer: 1, main_error: "E6", explanation: "The opportunity cost of studying Economics is studying Geography. The field trips are interesting to Timothy and this would increase the value of studying Geography. Thus, the cost of studying Economics increases.", is_self_contained: true, drill_ready: true, answer_validated: true },
    { id: "C17", pattern: "C", difficulty: 4, source: "QB Ch01", question: "(2023) Miss Lee bought a newly completed private residential unit two years ago for $8,000,000 and rented out the unit at $20,000 per month. After the tenant moved out recently, Miss Lee found out that the current average monthly rent of a similar residential unit is only $18,000. Meanwhile, an investor has offered to purchase Miss Lee's unit for $7,600,000.\n\nWhich of the following would be included in Miss Lee's opportunity cost of continuing to own and rent out the residential unit?", options: ["the $8,000,000 purchase price of the residential unit", "the $18,000 monthly rent", "the $2,000 drop in monthly rent", "the $7,600,000 resale price of the residential unit"], answer: 3, main_error: "E5", subtype: "C1", explanation: "If Miss Lee chooses to own and rent out the residential unit, she has to forgo the option of selling the unit. Therefore, Miss Lee\u2019s opportunity cost of continuing to own and rent out the residential unit is the value of selling the unit ($7,600,000).", is_self_contained: true, drill_ready: true, answer_validated: true },
